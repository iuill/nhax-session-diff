name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.5'
      - run: go test ./... && go vet ./...
      - name: Build portable CLI archives
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: bash scripts/package-release.sh "$RELEASE_VERSION"
      - name: Verify Linux executable and archive checksums
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          dist/packages/nhax-diff_${RELEASE_VERSION}_linux_amd64/nhax-diff --version
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          version = __import__('os').environ['RELEASE_VERSION']
          binary = f'dist/packages/nhax-diff_{version}_linux_amd64/nhax-diff'
          source = Path('dist/synthetic.nhax')
          source.write_bytes(subprocess.check_output(['python3', 'tests/browser/synthetic.py']))
          report = json.loads(subprocess.check_output([binary, 'diff', '--before', 'p0/s0/a0', '--after', 'p1/s0/a0', str(source)]))
          assert len(report['differences']) == 2
          PY
          cd "dist/releases/$RELEASE_VERSION"
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            dist/releases/${{ github.ref_name }}/*
            dist/synthetic.nhax
  verify-windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: packages
      - name: Run Windows CLI on synthetic data
        shell: pwsh
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          $archive = Get-ChildItem packages -Recurse -Filter '*windows_amd64.zip' | Select-Object -First 1
          Expand-Archive $archive.FullName -DestinationPath cli
          $sample = Get-ChildItem packages -Recurse -Filter 'synthetic.nhax' | Select-Object -First 1
          $version = & .\cli\nhax-diff.exe --version
          if ($LASTEXITCODE -ne 0 -or $version -ne "nhax-diff $env:RELEASE_VERSION") { throw 'Unexpected CLI version' }
          $report = & .\cli\nhax-diff.exe diff --before p0/s0/a0 --after p1/s0/a0 $sample.FullName | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $report.differences.Count -ne 2) { throw 'Windows comparison failed' }
  publish:
    needs: [build, verify-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: packages
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ github.ref_name }}
        run: gh release create "$RELEASE_VERSION" packages/releases/"$RELEASE_VERSION"/* --verify-tag --title "$RELEASE_VERSION" --notes-file docs/release-notes.md
